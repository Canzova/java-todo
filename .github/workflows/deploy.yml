# Workflow name displayed in GitHub Actions tab
# For full pipeline cheat sheet and explanation, see: notes.md
name: todo-app-ci-cd

# Workflow triggers (events that start the pipeline)
on: 
  # Trigger manually from GitHub UI ('Run workflow' button)
  workflow_dispatch:
    
  # Trigger automatically on git push to the main branch
  push:
    branches:
      - main

# Global environment variables accessible across all jobs/steps
env:
  # Tag Docker image with git commit SHA for unique versioning
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: todo-app

# Group of jobs to execute
jobs:
  # Job identifier
  build:
    # Display name of the job in UI
    name: Select the VM 
    # Operating system runner VM to use
    runs-on: ubuntu-latest

    # Sequence of tasks executed inside the runner
    steps:

      # Step 1: Clone repository code into runner workspace
      - name: checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Install JDK 21 (Temurin) and cache Maven dependencies
      - name: Setting up java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Grant execute permission and build Spring Boot JAR
      - name: Build your app 
        run: |
          chmod +x ./mvnw
          ./mvnw clean package
      
      # Step 4: Authenticate with Docker Hub using repo secrets & variables
      - name: Login in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # Step 5: Build Docker container image tagged with commit SHA
      - name: Build docker image
        run: |
          docker build -t ${{ vars.DOCKER_USERNAME }}/todo-app:${{ env.IMAGE_TAG }} .
      
      # Step 6: Push Docker container image to Docker Hub repository
      - name: Push docker image to dockerHub
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/todo-app:${{ env.IMAGE_TAG }}
          echo "Image pushed: ${{ vars.DOCKER_USERNAME }}/todo-app:${{ env.IMAGE_TAG }}"

      # Step 7: SSH into AWS EC2 instance, pull new Docker image, and run container
      - name: Deploying code to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          # Public IP or DNS of your EC2 instance (stored as a Repository Variable)
          host: ${{ vars.EC2_HOST }}
          # SSH username: 'ubuntu' for Ubuntu, 'ec2-user' for Amazon Linux (Repository Variable)
          username: ${{ vars.EC2_USERNAME }}
          # SSH Private Key (.pem file content stored in GitHub Secrets)
          # Note: If your secret is named EC2_PASSWORD or EC2_SSH_KEY, this handles both
          key: ${{ secrets.EC2_PASSWORD }}
          script: |
            # 1. Stop currently running container (|| true prevents failure if container does not exist yet)
            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            
            # 2. Remove stopped container so the name and ports can be reused
            sudo docker rm ${{ env.CONTAINER_NAME }} || true
            
            # 3. Pull the latest built Docker image from Docker Hub using the commit SHA tag
            sudo docker pull ${{ vars.DOCKER_USERNAME }}/todo-app:${{ env.IMAGE_TAG }}
            
            # 4. Start new container in detached mode (-d), forward port 8080, and auto-restart on system reboot
            sudo docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 8080:8080 ${{ vars.DOCKER_USERNAME }}/todo-app:${{ env.IMAGE_TAG }}
            
            # 5. Remove unused/dangling Docker images to prevent EC2 disk space exhaustion
            sudo docker image prune -f

